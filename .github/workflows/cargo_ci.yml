name: 'Cargo CI'

# Upstream ran this on every push with no branch filter and no concurrency
# group. On a fork that means a duplicate run for every push to every branch,
# and nothing cancels a superseded one. Pull requests are what gate merges
# here, and `hive` is the branch that has to stay green.
on:
  push:
    branches: [hive]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this workflow writes anything. The job this replaces handed
# GITHUB_TOKEN to actions-rs/clippy-check purely so it could post check
# annotations; running clippy directly needs no token at all.
permissions:
  contents: read

# Actions are pinned by commit with the moving tag in a trailing comment, the
# same convention the release workflow in the BMC-UI fork uses. The three
# actions-rs/* actions this file used to call have been archived and
# unmaintained since 2022, and actions/checkout@v3 runs on a Node runtime
# GitHub has already removed once.

jobs:
  cargo:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bmcd links libusb (rockusb/rusb), OpenSSL (actix-web's openssl
      # feature) and libudev (via evdev/serialport). Upstream installed only
      # libusb, in only one of the three jobs, and got away with it because
      # the runner image happened to carry the rest.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libusb-1.0-0-dev libssl-dev pkg-config libudev-dev

      # Pinned, not "stable". Clippy gains lints every release, and with
      # `-D warnings` below a new rustc would turn this red without anyone
      # touching the repo. This is also the version Cargo.lock is resolved
      # for: several dependencies are deliberately held one minor behind
      # because their current releases require rustc 1.88. Bump this together
      # with the Buildroot toolchain it is meant to match, and re-run
      # `cargo update` when you do.
      - name: rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
          # This action sets RUSTFLAGS='-D warnings' by default, which would
          # apply to every cargo call in the job. The deny-warnings gate
          # belongs on the clippy step, where it is visible.
          rustflags: ''

      - name: cargo fmt
        run: cargo fmt --all --check

      # `-D warnings` is the point of this step, and the tree is at zero
      # clippy warnings as of this commit, so it does not need an exception.
      # If a future toolchain bump introduces new lints, fix them or pin the
      # toolchain -- do not soften this.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --locked everywhere: CI must build the Cargo.lock that is committed,
      # and fail loudly if the manifest and the lock have drifted, rather than
      # quietly resolving something else and testing that instead.
      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # The `stubbed` feature swaps the GPIO/sysfs HAL for an in-memory
      # simulation, and is the only way to run this daemon without a Turing Pi
      # board under it. It had not compiled since before v2.3.7, because
      # nothing built it -- the default build is the only thing CI ever asked
      # for, so the stub drifted out of sync with the HAL it stands in for and
      # nobody found out. These two steps are what stops that happening again.
      #
      # `--features stubbed` rather than `--all-features`: the other feature,
      # `vendored`, statically links OpenSSL for cross-builds and would have
      # this job compile OpenSSL from source for no benefit.
      - name: cargo clippy (stubbed)
        run: cargo clippy --workspace --all-targets --features stubbed --locked -- -D warnings

      - name: cargo test (stubbed)
        run: cargo test --workspace --features stubbed --locked

  cross:
    name: cross-compile for the board
    runs-on: ubuntu-latest

    # Cost one firmware build round trip on 2026-09-09 (SQU-171). bmcd 2.15.0
    # multiplied two `statvfs` counts. They are `u64` on x86-64 and **`u32` on
    # this board's 32-bit ARM**, so every job above was green and the Buildroot
    # cross-compile failed two hours later -- which was, until this job, the
    # only thing in the estate that compiled bmcd for the target at all.
    #
    # A `check`, not a build: it type-checks against the target's libc and
    # integer widths, which is the entire class of error this exists to catch.
    # It does not need to link, and the check itself takes about 20 seconds.
    #
    # Verified by reintroducing the 2.15.0 expression on a scratch tree: the
    # clippy job above stays green while this one fails with
    #   error[E0308]: expected `u32`, found `u64`
    # at the comparison. That asymmetry is the whole point of the job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ubuntu's main archive carries amd64 only; armhf lives on
      # ports.ubuntu.com. Without splitting the sources by architecture,
      # `apt-get update` 404s on every armhf index and the cross libraries
      # below cannot be found.
      - name: armhf sysroot
        run: |
          set -eu
          sudo sed -i 's/^Components: main/Architectures: amd64\nComponents: main/' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/armhf.sources >/dev/null <<'SRC'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sudo dpkg --add-architecture armhf
          sudo apt-get update -qq
          # The same three libraries the host job installs, for the target:
          # libusb (rockusb/rusb), OpenSSL (actix-web) and libudev
          # (evdev/serialport). Their build scripts resolve through pkg-config
          # against this sysroot rather than vendoring, which is what keeps the
          # job at seconds instead of compiling OpenSSL from source.
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            libusb-1.0-0-dev:armhf libssl-dev:armhf libudev-dev:armhf

      - name: rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.98.1'
          target: armv7-unknown-linux-gnueabihf
          rustflags: ''

      # armv7-unknown-linux-gnueabihf is the triple Buildroot's rust-bin uses
      # for this board. PKG_CONFIG_ALLOW_CROSS is what lets pkg-config answer
      # for an architecture that is not the host's; without it the openssl-sys
      # build script refuses rather than looking in the sysroot.
      - name: cargo check (armv7)
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo check --target armv7-unknown-linux-gnueabihf \
            --workspace --all-targets --locked

  cargo-deny:
    name: licences, bans, sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v1 of this action is unmaintained and ships a cargo-deny old enough to
      # still accept the pre-2.x deny.toml schema. Moving to v2 is why
      # deny.toml had to be migrated in this same series -- the old file is a
      # hard parse error on any current cargo-deny, so this job could not have
      # passed on v2 without that change.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
