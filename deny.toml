# cargo-deny configuration.
#
# Migrated to the cargo-deny 2.x schema on 2026-09-07. The keys that used to
# live here -- unlicensed, copyleft, allow-osi-fsf-free, default and deny --
# were removed upstream in EmbarkStudios/cargo-deny#611 and are now hard
# errors, so the old file no longer parsed at all. Under the current schema
# the allow list below is exhaustive: any licence not named here is rejected,
# which is what the removed keys used to say the long way round.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "MPL-2.0",
    "Unicode-DFS-2016",
    # Unicode-3.0 is the successor to Unicode-DFS-2016 above, and is what the
    # icu_* family and unicode-ident relicensed to. OSI approved, permissive.
    "Unicode-3.0",
    # Zlib arrived with foldhash, via hashbrown. OSI approved, FSF Free/Libre,
    # permissive.
    "Zlib",
    "CC0-1.0"
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

# Advisories that do not apply to this daemon, or that wait on a planned
# change. Each one says why; anything not listed here fails the check.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0443", reason = "actix-files: Windows 8.3 short names only; the board is Linux. The fix is in actix-files 0.7.4, a major bump for a later change." },
    { id = "RUSTSEC-2025-0141", reason = "#93 step 4: reader for existing bmcd.bin first" },
    { id = "RUSTSEC-2026-0594", reason = "cookie 0.16 via actix-web: only PrivateJar::add and add_original are affected (AES-GCM nonce reuse after fork()), and PrivateJar exists only behind cookie's `private` feature, which actix-web does not enable and bmcd does not use (Cargo.lock has no aes-gcm). bmcd sets no cookies at all; it authenticates with Bearer tokens, and it does not fork. The fixed cookie (0.18.3) is not in reach: actix-web 4.20.0, the newest, still requires cookie ^0.16. Revisit when an actix-web release depends on cookie >= 0.18.3." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; used to format and parse UTC timestamps. Replacing it is its own change." },
]
