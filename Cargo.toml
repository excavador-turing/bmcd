[workspace]
members = [
    "bmcd",
    "board_info"
]
resolver = "2"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1

# The hashing and checksum loops are where size-optimised code costs speed.
# They are a few KB at opt-level 3 and everything else stays at "z". Suggested
# by @danste22 in BMC-Firmware#93. A package spec names every version of the
# crate in the tree (sha2 is there twice, 0.9 through pwhash and 0.10).
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.crc]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3
